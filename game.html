<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Love Me?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      box-sizing: border-box;
    }

    .app-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Comic Sans MS', 'Trebuchet MS', cursive;
      overflow: hidden;
      position: relative;
    }

    .app-wrapper.success {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    /* Animated background elements */
    .floating-heart {
      position: absolute;
      font-size: 2rem;
      opacity: 0.3;
      animation: float 6s ease-in-out infinite;
    }

    .floating-heart:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
    .floating-heart:nth-child(2) { top: 20%; right: 10%; animation-delay: 1s; }
    .floating-heart:nth-child(3) { bottom: 15%; left: 15%; animation-delay: 2s; }
    .floating-heart:nth-child(4) { top: 30%; right: 5%; animation-delay: 3s; }
    .floating-heart:nth-child(5) { bottom: 20%; right: 20%; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); }
      25% { transform: translateY(-20px) translateX(10px) rotate(5deg); }
      50% { transform: translateY(-40px) translateX(0) rotate(0deg); }
      75% { transform: translateY(-20px) translateX(-10px) rotate(-5deg); }
    }

    /* Container */
    .game-container {
      text-align: center;
      z-index: 10;
      position: relative;
    }

    .question-box {
      background: rgba(255, 255, 255, 0.95);
      padding: 60px 80px;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      margin-bottom: 50px;
      animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      0% {
        opacity: 0;
        transform: translateY(40px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .question-text {
      font-size: 3.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      letter-spacing: 1px;
    }

    .question-emoji {
      font-size: 4rem;
      margin-left: 15px;
      display: inline-block;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-15px) scale(1.1); }
    }

    /* Buttons container */
    .buttons-container {
      display: flex;
      gap: 40px;
      justify-content: center;
      align-items: center;
      position: relative;
      height: 100px;
    }

    /* YES Button */
    .yes-button {
      padding: 18px 50px;
      font-size: 1.5rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
      font-family: 'Comic Sans MS', cursive;
      position: relative;
      z-index: 20;
    }

    .yes-button:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 35px rgba(46, 204, 113, 0.6);
    }

    .yes-button:active {
      transform: scale(0.95);
    }

    /* NO Button */
    .no-button {
      padding: 18px 50px;
      font-size: 1.5rem;
      font-weight: bold;
      border: 3px solid white;
      border-radius: 50px;
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
      font-family: 'Comic Sans MS', cursive;
      position: absolute;
      user-select: none;
    }

    .no-button:hover {
      box-shadow: 0 12px 35px rgba(231, 76, 60, 0.6);
    }

    /* Success Screen */
    .success-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      z-index: 100;
      animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .success-screen.active {
      display: flex;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5) rotateZ(-10deg);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotateZ(0deg);
      }
    }

    .success-message {
      font-size: 4rem;
      font-weight: bold;
      color: white;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
      letter-spacing: 2px;
    }

    .success-emoji {
      font-size: 6rem;
      animation: spin 2s ease-in-out infinite;
    }

    @keyframes spin {
      0% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.2) rotate(10deg); }
      50% { transform: scale(1) rotate(0deg); }
      75% { transform: scale(1.2) rotate(-10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .heart-rain {
      position: fixed;
      pointer-events: none;
      font-size: 2rem;
      animation: fall 3s ease-in forwards;
    }

    @keyframes fall {
      0% {
        opacity: 1;
        transform: translateY(0) translateX(0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(600px) translateX(200px) rotate(720deg);
      }
    }

    .reset-button {
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.9);
      color: #764ba2;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Comic Sans MS', cursive;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    .reset-button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    /* Confetti */
    .confetti {
      position: fixed;
      pointer-events: none;
      animation: confettiFall 3s ease-in forwards;
    }

    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translateY(-10px) translateX(0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(600px) translateX(150px) rotate(720deg);
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .question-box {
        padding: 40px 30px;
        margin-bottom: 40px;
      }

      .question-text {
        font-size: 2.5rem;
      }

      .question-emoji {
        font-size: 3rem;
      }

      .yes-button {
        padding: 14px 35px;
        font-size: 1.2rem;
      }

      .no-button {
        padding: 14px 35px;
        font-size: 1.2rem;
      }

      .success-message {
        font-size: 2.5rem;
      }

      .success-emoji {
        font-size: 4rem;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>

 <body class="h-full">
  <div class="app-wrapper" id="appWrapper"><!-- Floating hearts background -->
   <div class="floating-heart">
    ❤️
   </div>
   <div class="floating-heart">
    💕
   </div>
   <div class="floating-heart">
    💖
   </div>
   <div class="floating-heart">
    💗
   </div>
   <div class="floating-heart">
    💝
   </div><!-- Main game container -->
   <div class="game-container" id="gameContainer">
    <div class="question-box">
     <p class="question-text">Do you love me? <span class="question-emoji">💕</span></p>
    </div>
    <div class="buttons-container"><button class="yes-button" id="yesButton">Yes</button> <button class="no-button" id="noButton">No</button>
    </div>
   </div><!-- Success screen -->
   <div class="success-screen" id="successScreen">
    <div class="success-emoji">
     😄❤️
    </div>
    <div class="success-message">
     I knew it!
    </div><button class="reset-button" id="resetButton">Ask Again</button>
   </div>
  </div>
  <script>
    const yesButton = document.getElementById('yesButton');
    const noButton = document.getElementById('noButton');
    const successScreen = document.getElementById('successScreen');
    const gameContainer = document.getElementById('gameContainer');
    const resetButton = document.getElementById('resetButton');
    const appWrapper = document.getElementById('appWrapper');

    let noButtonActive = true;

    // YES button click handler
    yesButton.addEventListener('click', () => {
      showSuccess();
    });

    // Show success
    function showSuccess() {
      noButtonActive = false;
      gameContainer.style.opacity = '0';
      gameContainer.style.pointerEvents = 'none';
      successScreen.classList.add('active');
      appWrapper.classList.add('success');

      // Create confetti and hearts
      createConfetti();
    }

    // Create confetti and falling hearts
    function createConfetti() {
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.style.left = Math.random() * window.innerWidth + 'px';
          confetti.style.top = '-10px';
          confetti.style.fontSize = Math.random() * 20 + 10 + 'px';
          confetti.style.color = ['❤️', '💕', '💖', '💗', '💝', '✨', '🎉'][Math.floor(Math.random() * 7)];
          confetti.textContent = confetti.style.color;
          confetti.className = 'confetti';
          
          const delay = Math.random() * 0.5;
          confetti.style.animationDelay = delay + 's';
          confetti.style.animationDuration = (2 + Math.random() * 1) + 's';

          document.body.appendChild(confetti);

          setTimeout(() => {
            confetti.remove();
          }, 3500);
        }, i * 50);
      }
    }

    // Reset button
    resetButton.addEventListener('click', () => {
      successScreen.classList.remove('active');
      gameContainer.style.opacity = '1';
      gameContainer.style.pointerEvents = 'auto';
      appWrapper.classList.remove('success');
      noButtonActive = true;

      // Reset NO button position
      noButton.style.position = 'absolute';
      noButton.style.left = 'calc(50% + 80px)';
      noButton.style.top = '50%';
      noButton.style.transform = 'translate(0, -50%)';
    });

    // NO button escape logic
    const noButtonContainer = document.querySelector('.buttons-container');

    document.addEventListener('mousemove', (e) => {
      if (!noButtonActive) return;

      const noRect = noButton.getBoundingClientRect();
      const centerX = noRect.left + noRect.width / 2;
      const centerY = noRect.top + noRect.height / 2;

      const distance = Math.sqrt(
        Math.pow(e.clientX - centerX, 2) + Math.pow(e.clientY - centerY, 2)
      );

      // If mouse is within 100px of button, move it away
      if (distance < 100) {
        moveNoButtonAway(e.clientX, e.clientY);
      }
    });

    function moveNoButtonAway(mouseX, mouseY) {
      // Get random position away from mouse
      const angle = Math.atan2(mouseY - window.innerHeight / 2, mouseX - window.innerWidth / 2);
      const distance = 250;

      const newX = window.innerWidth / 2 + Math.cos(angle + Math.PI) * distance;
      const newY = window.innerHeight / 2 + Math.sin(angle + Math.PI) * distance;

      // Keep button within bounds
      const boundX = Math.max(50, Math.min(newX, window.innerWidth - 150));
      const boundY = Math.max(80, Math.min(newY, window.innerHeight - 80));

      noButton.style.position = 'fixed';
      noButton.style.left = boundX + 'px';
      noButton.style.top = boundY + 'px';
      noButton.style.transform = 'translate(-50%, -50%)';
    }

    // Touch support for mobile
    document.addEventListener('touchmove', (e) => {
      if (!noButtonActive || e.touches.length === 0) return;

      const touch = e.touches[0];
      const noRect = noButton.getBoundingClientRect();
      const centerX = noRect.left + noRect.width / 2;
      const centerY = noRect.top + noRect.height / 2;

      const distance = Math.sqrt(
        Math.pow(touch.clientX - centerX, 2) + Math.pow(touch.clientY - centerY, 2)
      );

      if (distance < 120) {
        moveNoButtonAway(touch.clientX, touch.clientY);
      }
    }, false);

    // Element SDK configuration
    const defaultConfig = {
      primary_color: "#667eea",
      secondary_color: "#764ba2",
      accent_color: "#2ecc71",
      font_family: "Comic Sans MS"
    };

    let config = { ...defaultConfig };

    async function onConfigChange(cfg) {
      config = { ...defaultConfig, ...cfg };
    }

    function mapToCapabilities(cfg) {
      return {
        recolorables: [
          {
            get: () => cfg.primary_color || defaultConfig.primary_color,
            set: (value) => {
              cfg.primary_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ primary_color: value });
            }
          },
          {
            get: () => cfg.accent_color || defaultConfig.accent_color,
            set: (value) => {
              cfg.accent_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ accent_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }

    function mapToEditPanelValues(cfg) {
      return new Map();
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>
